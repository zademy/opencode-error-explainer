name: CI

on:
  # develop: verify across all 3 OSes.
  # tags: release (publish to npm). Verification already happened on develop.
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  # Manual publish button: Actions → "CI" → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + format + typecheck + test + build (${{ matrix.os }}, node ${{ matrix.node }})
    # Verification runs on develop only. main is the release branch: it merges
    # PRs that already passed this matrix, so re-running it there would burn 6
    # runners re-proving work that is already green.
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin shells out to `git` and resolves OS/runtime context at
        # runtime, so every OS has to build and pass on its own.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify the package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    # Deliberately does NOT need `verify`: that matrix already ran on develop
    # when this commit was merged into main, and waiting on it here would
    # rebuild the same code 6 more times just to publish it.
    needs: []
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - name: Show what is about to be published
        run: npm publish --dry-run --access public
      - name: Publish (public, with provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
