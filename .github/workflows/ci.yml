name: CI

# Compiles only when a pull request targets main. A push to develop does
# nothing on purpose: the PR is where the build has to be green before it can
# be merged, so running it twice on the same commit is wasted work.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + format + typecheck + test + build (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin shells out to `git` and resolves OS/runtime context at
        # runtime, so every OS has to build and pass on its own.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22"]
    # A leaked child process can keep vitest waiting on stdio forever; fail the
    # job instead of burning the default timeout on a hung run.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify the package contents
        run: npm pack --dry-run
