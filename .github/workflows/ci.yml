name: CI

on:
  # develop only, and only on push. A pull_request trigger here would fire a
  # second, identical run for the same commit on top of this one, doubling
  # the jobs for no extra coverage. The checks land on the commit SHA either
  # way, so main's required status checks are still satisfied by this run.
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + format + typecheck + test + build (${{ matrix.os }}, node ${{ matrix.node }})
    # Redundant with the push trigger but kept as a guard: main is the release
    # branch and must never re-run the matrix.
    if: github.ref == 'refs/heads/develop'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin shells out to `git` and resolves OS/runtime context at
        # runtime, so every OS has to build and pass on its own.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify the package contents
        run: npm pack --dry-run
