name: CI

on:
  # develop is the only branch that gets verified across all 3 OSes.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + format + typecheck + test + build (${{ matrix.os }}, node ${{ matrix.node }})
    # Verification runs on develop only. main is the release branch: it merges
    # PRs that already passed this matrix, so re-running it there would burn 6
    # runners re-proving work that is already green.
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin shells out to `git` and resolves OS/runtime context at
        # runtime, so every OS has to build and pass on its own.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify the package contents
        run: npm pack --dry-run
