name: Release

# Fires when a pull request is merged into main. main is protected, so a push
# to it can only be a merge: the release is published by merging the PR, not by
# pushing a tag by hand. The workflow creates the tag itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history: the commit list needs the tags and the log between them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Build the exact artifact npm serves and attach it, so anyone can verify
      # the release matches the package instead of trusting the tag.
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination .

      - name: Read version from package.json
        id: ver
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION from $(git rev-parse --short HEAD) on main"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            # An annotated tag needs a git identity and the runner has none:
            # "fatal: empty ident name ... not allowed" without these two lines.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
              git tag -a "$VERSION" -m "$VERSION"
              git push origin "$VERSION"
            fi

            # Notes are built BEFORE the release is created: gh release create
            # with an empty body exits 0, prints a URL, and creates nothing.
            PREV=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)
            {
              if [ -n "$PREV" ]; then
                echo "## Commits since $PREV"
                echo
                git log --no-merges --format='- %s (%h)' "${PREV}..HEAD"
                echo
              fi
              echo "See CHANGELOG.md for the full breakdown."
            } > release-notes.md

            # No --target: the tag already exists on this commit, and the API
            # rejects a tag name as target_commitish (HTTP 422).
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file release-notes.md \
              "./*.tgz"
          else
            echo "Release $VERSION already exists, leaving it untouched"
          fi
