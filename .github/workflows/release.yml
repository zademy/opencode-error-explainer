name: Release

# Cuts the GitHub Release from a v* tag on main. The tag is the only trigger,
# so a release can never exist for a commit that was never tagged.
on:
  push:
    tags: ["v*"]
  # Manual re-run for a tag that already exists (e.g. to repair release notes).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Tags only, never a branch push: a merge to main/develop must not mint a release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Full history: the commit list needs the tags and the log between them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag and match it against package.json
        id: ver
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$MANUAL_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping"
            exit 0
          fi
          # No --target: the tag already exists on the pushed commit, and the
          # API rejects a tag name as target_commitish (HTTP 422).
          # --generate-notes only lists merged PRs; this repo pushes direct to main,
          # so the commit list comes from git log between tags instead.
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "No previous tag, keeping the native notes"
            exit 0
          fi
          {
            echo "## Commits since $PREV"
            echo
            git log --no-merges --format='- %s (%h)' "${PREV}..${TAG}"
            echo
            echo "See CHANGELOG.md for the full breakdown."
          } > release-notes.md
          gh release edit "$VERSION" --notes-file release-notes.md
